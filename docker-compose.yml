version: '3.8'

services:
  # ==========================================
  # INFRAESTRUCTURA
  # ==========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saas_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saas-network

  nats:
    image: nats:2.10-alpine
    container_name: saas-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - saas-network

  # ==========================================
  # MICROSERVICIOS
  # ==========================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: saas-api-gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - CHAT_SERVICE_URL=http://chat-service:3002
      - AUTH_SERVICE_URL=http://auth-service:3003
      - BILLING_SERVICE_URL=http://billing-service:3004
      - USAGE_SERVICE_URL=http://usage-service:3005
    depends_on:
      - nats
      - redis
    networks:
      - saas-network

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: saas-chat-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_db}?schema=public
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_PROXY_URL=${OLLAMA_PROXY_URL}
      - OLLAMA_PROXY_API_KEY=${OLLAMA_PROXY_API_KEY}
      - PUBLIC_MODELS=${PUBLIC_MODELS}
      - PRO_MODELS=${PRO_MODELS}
    depends_on:
      - postgres
      - nats
    networks:
      - saas-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: saas-auth-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - PUBLIC_URL=${PUBLIC_URL}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - saas-network

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: saas-billing-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_db}?schema=public
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PREMIUM_PRICE_ID=${STRIPE_PREMIUM_PRICE_ID}
    depends_on:
      - postgres
      - nats
    networks:
      - saas-network

  usage-service:
    build:
      context: ./usage-service
      dockerfile: Dockerfile
    container_name: saas-usage-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-saas_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - FREE_USER_MESSAGE_LIMIT=${FREE_USER_MESSAGE_LIMIT:-3}
      - REGISTERED_USER_MESSAGE_LIMIT=${REGISTERED_USER_MESSAGE_LIMIT:-5}
      - PREMIUM_USER_MESSAGE_LIMIT=${PREMIUM_USER_MESSAGE_LIMIT:-50}
    depends_on:
      - postgres
      - redis
      - nats
    networks:
      - saas-network

volumes:
  postgres_data:
  redis_data:

networks:
  saas-network:
    driver: bridge
