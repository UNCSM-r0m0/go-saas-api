# Spec-Driven Development (SDD) - Phase 5: Deploy
# Gentle-AI Workflow Configuration

name: sdd-deploy
version: "1.0.0"
description: Deployment and DevOps configuration

model:
  primary: opencode-go/glm-5  # Good for DevOps
  fallback: kimi-code/kimi-k2

code_generation:
  language: yaml
  tools: [docker, kubernetes, terraform]

steps:
  - id: docker-config
    name: Docker Configuration
    description: Create optimized Docker images
    prompt_template: |
      Create Dockerfile for {{service_name}}:
      
      Requirements:
      - Multi-stage build
      - Minimal final image (distroless or alpine)
      - Security hardening
      - Health checks
      - Non-root user
      
      Include docker-compose updates.
    
  - id: k8s-manifests
    name: Kubernetes Manifests
    description: Create K8s deployment files
    prompt_template: |
      Create Kubernetes manifests:
      
      1. Deployment
      2. Service
      3. ConfigMap
      4. Secrets (references)
      5. HPA (Horizontal Pod Autoscaler)
      6. Ingress
      
      Best practices:
      - Resource limits
      - Probes (liveness/readiness)
      - Rolling updates
      - Anti-affinity
    
  - id: ci-cd-pipeline
    name: CI/CD Pipeline
    description: Create GitHub Actions workflow
    prompt_template: |
      Create GitHub Actions workflow:
      
      Stages:
      1. Build & Test
      2. Security Scan
      3. Build Images
      4. Push to Registry
      5. Deploy to Staging
      6. Integration Tests
      7. Deploy to Production
      
      Include caching, parallel jobs.
    
  - id: monitoring-setup
    name: Monitoring Setup
    description: Configure observability
    prompt_template: |
      Setup monitoring:
      
      1. Prometheus metrics
      2. Grafana dashboards
      3. AlertManager rules
      4. Distributed tracing (Jaeger)
      5. Structured logging (ELK/Loki)

output:
  directory: deploy
  files:
    - Dockerfile
    - docker-compose.prod.yml
    - k8s/
    - .github/workflows/ci-cd.yml

transition:
  next_phase: complete
  condition: deployment_success
