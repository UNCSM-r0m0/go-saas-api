# Spec-Driven Development (SDD) - Phase 3: Code
# Gentle-AI Workflow Configuration

name: sdd-code
version: "1.0.0"
description: Implement code based on architecture specifications

# Model Configuration - Optimized for coding
model:
  primary: kimi-code/kimi-k2  # Faster model for coding
  fallback: kimi-code/kimi-k2.5
  temperature: 0.2  # Lower for more deterministic code
  max_tokens: 8192

# Context
context:
  use_engram: true
  session_memory: true
  load_previous_phases: true
  required_inputs:
    - specs/{{feature_name}}-spec.md
    - docs/architecture/{{feature_name}}-arch.md

# Code Generation Rules
code_generation:
  language: go
  framework: gin
  architecture: microservices
  
  standards:
    - gofmt
    - golint
    - go vet
    - gosec
  
  patterns:
    - interface-based-design
    - dependency-injection
    - error-wrapping
    - structured-logging

# Workflow Steps
steps:
  - id: generate-models
    name: Generate Data Models
    description: Create structs and database models
    prompt_template: |
      Generate Go structs for:
      Feature: {{feature_name}}
      
      Based on:
      {{arch_content}}
      
      Create:
      1. Domain models (structs)
      2. DTOs for API
      3. Database models (if using ORM)
      4. Validation tags
      
      Follow Go conventions:
      - Use pointer receivers appropriately
      - Add JSON tags
      - Implement Stringer interface where useful
      - Add method documentation
    
  - id: implement-service-layer
    name: Implement Service Layer
    description: Create business logic services
    prompt_template: |
      Implement service layer for {{feature_name}}:
      
      Requirements:
      - Use interfaces for testability
      - Inject dependencies via constructor
      - Handle errors with context
      - Use structured logging (zap)
      - Add context.Context to all methods
      
      Create:
      1. Service interface
      2. Service implementation
      3. Repository interface (if needed)
      
      Code style:
      {{code_style_guide}}
    
  - id: implement-handlers
    name: Implement HTTP Handlers
    description: Create Gin HTTP handlers
    prompt_template: |
      Implement HTTP handlers for {{feature_name}}:
      
      For each endpoint:
      - Input validation
      - Authentication check
      - Service call
      - Response formatting
      - Error handling
      
      Include:
      1. Handler structs
      2. Route registration
      3. Middleware application
      4. Swagger/OpenAPI comments
    
  - id: implement-tests
    name: Generate Unit Tests
    description: Create comprehensive tests
    prompt_template: |
      Generate unit tests for {{feature_name}}:
      
      Create tests for:
      1. Service methods (with mocks)
      2. Handlers (with httptest)
      3. Validation logic
      4. Edge cases
      
      Use:
      - testify/assert
      - testify/mock
      - table-driven tests
      - Parallel execution where safe
      
      Aim for >80% coverage.

# File Generation
files:
  - template: models.go
    path: "{{service_name}}/internal/models/{{feature_name}}.go"
  
  - template: service.go
    path: "{{service_name}}/internal/service/{{feature_name}}_service.go"
  
  - template: handler.go
    path: "{{service_name}}/internal/handlers/{{feature_name}}_handler.go"
  
  - template: repository.go
    path: "{{service_name}}/internal/repository/{{feature_name}}_repo.go"
    optional: true
  
  - template: test.go
    path: "{{service_name}}/internal/service/{{feature_name}}_service_test.go"

# Code Quality Checks
quality:
  linters:
    - gofmt
    - golint
    - go vet
    - staticcheck
    - gosec
  
  coverage:
    min: 70
    target: 80
  
  complexity:
    max_cyclomatic: 15

# Output
output:
  directory: .
  format: go
  verify_syntax: true

# Validation
validation:
  - type: go_compilation
    must_compile: true
  
  - type: test_execution
    must_pass: true
  
  - type: linting
    max_issues: 5

# Next Phase
transition:
  next_phase: sdd-test
  auto_transition: true
  condition: compilation_success
