# Spec-Driven Development (SDD) - Phase 1: Specification
# Gentle-AI Workflow Configuration

name: sdd-specification
version: "1.0.0"
description: Create detailed specifications for features

# Model Configuration for this phase
model:
  primary: kimi-code/kimi-k2.5
  fallback: opencode-go/kimi-k2.5
  temperature: 0.3  # Lower for more precise specs
  max_tokens: 8192

# Context & Memory
context:
  use_engram: true
  session_memory: true
  load_previous_phases: false

# Workflow Steps
steps:
  - id: analyze-requirements
    name: Analyze Requirements
    description: Understand and analyze feature requirements
    prompt_template: |
      You are a technical specification writer. Analyze the following requirements
      and create a detailed specification document.
      
      Feature: {{feature_name}}
      Description: {{feature_description}}
      
      Context from project:
      {{project_context}}
      
      Create a specification that includes:
      1. Overview and objectives
      2. Functional requirements
      3. Non-functional requirements
      4. API contracts (if applicable)
      5. Data models
      6. Edge cases and constraints
      
      Use clear, unambiguous language.
    
  - id: define-acceptance-criteria
    name: Define Acceptance Criteria
    description: Create testable acceptance criteria
    prompt_template: |
      Based on the specification created, define clear acceptance criteria:
      
      For each requirement, provide:
      - Given [context]
      - When [action]
      - Then [expected result]
      
      Format: Gherkin syntax
      
      Specification:
      {{previous_output}}
    
  - id: identify-dependencies
    name: Identify Dependencies
    description: Map dependencies and integration points
    prompt_template: |
      Identify all dependencies for this feature:
      
      1. Internal services affected
      2. External APIs needed
      3. Database schema changes
      4. Configuration changes
      5. Migration requirements
      
      Create a dependency graph.

# Output Configuration
output:
  directory: specs
  filename_template: "{{feature_name}}-spec.md"
  format: markdown
  sections:
    - title: "Overview"
      required: true
    - title: "Requirements"
      required: true
    - title: "API Contracts"
      required: false
    - title: "Data Models"
      required: false
    - title: "Acceptance Criteria"
      required: true
    - title: "Dependencies"
      required: true

# Validation
validation:
  - type: required_sections
    sections: ["Overview", "Requirements", "Acceptance Criteria"]
  
  - type: word_count
    min: 500
    max: 5000

# Next Phase
transition:
  next_phase: sdd-architecture
  condition: manual_approval
  auto_transition: false
