# Spec-Driven Development (SDD) - Phase 4: Testing
# Gentle-AI Workflow Configuration

name: sdd-test
version: "1.0.0"
description: Comprehensive testing and quality assurance

model:
  primary: kimi-code/kimi-k2.5
  fallback: opencode-go/kimi-k2.5
  temperature: 0.3

context:
  use_engram: true
  load_previous_phases: true

steps:
  - id: integration-tests
    name: Integration Tests
    description: Create integration tests
    prompt_template: |
      Create integration tests for {{feature_name}}:
      
      Test scenarios:
      1. Happy path
      2. Error scenarios
      3. Edge cases
      4. Performance boundaries
      
      Use:
      - testcontainers for databases
      - httptest for HTTP clients
      - Real service calls (not mocks)
    
  - id: e2e-tests
    name: End-to-End Tests
    description: Create E2E test scenarios
    prompt_template: |
      Create E2E tests for critical user flows:
      
      Example scenarios:
      - User registration → Login → Action
      - Complete business workflow
      - Error recovery flows
      
      Tools: Playwright or Cypress
    
  - id: security-audit
    name: Security Audit
    description: Security testing and audit
    prompt_template: |
      Perform security audit:
      
      Check for:
      - SQL injection
      - XSS vulnerabilities
      - CSRF protection
      - Authentication bypasses
      - Sensitive data exposure
      - Race conditions
      
      Tools: gosec, semgrep

output:
  directory: tests
  sections:
    - integration_tests
    - e2e_tests
    - security_report

transition:
  next_phase: sdd-deploy
  condition: all_tests_pass
