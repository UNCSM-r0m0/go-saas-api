# Gentle-AI Main Configuration
# Ecosystem configurator for go-saas-api

version: "1.0.0"
project:
  name: "go-saas-api"
  description: "Go Microservices SaaS Platform with AI Chat"
  language: "go"
  architecture: "microservices"

# AI Providers Configuration
providers:
  kimi-code:
    base_url: "https://api.kimi.ai/v1"
    api_key_env: "KIMI_CODE_API_KEY"
    models:
      - kimi-k2.5
      - kimi-k2
    default: kimi-k2.5
  
  opencode-go:
    base_url: "https://opencode.ai/zen/go/v1"
    api_key_env: "OPENCODE_GO_API_KEY"
    models:
      - kimi-k2.5
      - glm-5
      - minimax-m2.5
    default: kimi-k2.5

# SDD Workflow Configuration
workflow:
  name: "Spec-Driven Development"
  phases:
    - spec
    - arch
    - code
    - test
    - deploy
  
  current_phase: spec
  
  auto_transition: false
  require_approval: true

# MCP Servers
mcp_servers:
  engram:
    enabled: true
    command: "engram"
    args: ["mcp", "--transport", "stdio"]
    description: "Persistent memory system"
  
  filesystem:
    enabled: true
    command: "npx"
    args: ["@modelcontextprotocol/server-filesystem", "~/go-saas-api"]
    description: "File system access"
  
  postgres:
    enabled: false  # Enable when needed
    command: "npx"
    args: ["@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
    description: "PostgreSQL access"
  
  git:
    enabled: true
    command: "npx"
    args: ["@modelcontextprotocol/server-git", "~/go-saas-api"]
    description: "Git operations"

# Memory Configuration
memory:
  provider: "engram"
  auto_save: true
  context_window: 50
  similarity_threshold: 0.85
  persistence: "sqlite"

# Skills Configuration
skills:
  auto_install: true
  sources:
    - skills.sh
    - github.com/Gentleman-Programming
  
  installed:
    - go-microservices-architecture
    - gin-api-gateway
    - go-sse-streaming
    - go-testing
    - docker-microservices
    - sdd-workflow

# Security
security:
  permissions:
    filesystem:
      read: ["~/go-saas-api", "~/.config"]
      write: ["~/go-saas-api"]
    
    network:
      allowed: ["localhost", "api.github.com", "api.kimi.ai"]
    
    commands:
      allowed: ["go", "git", "docker", "docker-compose", "kubectl"]
      forbidden: ["sudo", "rm -rf /", "dd", "mkfs"]
  
  require_confirmation:
    - destructive_operations
    - network_requests
    - file_deletions

# Logging
logging:
  level: "info"
  format: "json"
  output: "stdout"
  
# Persona
persona:
  name: "Teaching Developer"
  style: "educational"
  explain_reasoning: true
  suggest_improvements: true
  security_first: true

# Features
features:
  streaming: true
  multi_model: true
  persistent_memory: true
  mcp_tools: true
  code_analysis: true
  security_audit: true
