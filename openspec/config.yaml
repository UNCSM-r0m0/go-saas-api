schema: spec-driven

context: |
  Tech stack: Go 1.24, Gin, PostgreSQL (pgx/v5), Redis (go-redis/v9), NATS
  Architecture: Microservices (API Gateway, Chat, Auth, Billing, Usage)
  Testing: go test (built-in), golangci-lint
  Style: Standard Go conventions, gofmt

strict_tdd: true

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: "2026-04-22"

  test_runner:
    command: "go test ./..."
    framework: "go test"

  layers:
    unit:
      available: true
      tool: "go test"
    integration:
      available: true
      tool: "net/http/httptest"
    e2e:
      available: false
      tool: "—"

  coverage:
    available: true
    command: "go test -cover"

  quality_tools:
    linter:
      available: true
      command: "golangci-lint run ./..."
    type_checker:
      available: true
      command: "go vet"
    formatter:
      available: true
      command: "gofmt"
